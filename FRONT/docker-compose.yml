services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: purplesky
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ghcr.io/heroofussr/purpleskyttrpg:latest
    depends_on:
      - postgres
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=purplesky;Username=postgres;Password=devpassword123"
    ports:
      - "5001:8080"

volumes:
  pgdata: